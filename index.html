<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDM Global Workers LMS | Firebase Cloud Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase App & Services CDNs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col justify-between">

    <!-- Auth Modal -->
    <div id="authModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full overflow-hidden border border-slate-200">
            <div class="bg-gradient-to-r from-purple-800 to-indigo-900 text-white p-8 text-center space-y-2">
                <div class="w-16 h-16 bg-white/10 rounded-2xl mx-auto flex items-center justify-center text-purple-200 text-2xl mb-2">
                    <i class="fa-solid fa-cloud"></i>
                </div>
                <h2 class="font-bold text-xl tracking-tight">PDM Global Workers LMS</h2>
            </div>
            
            <form id="authForm" onsubmit="handleAuth(event)" class="p-8 space-y-4">
                <div id="nameFieldGroup" class="space-y-1 hidden">
                    <label class="block text-xs font-bold text-slate-700 uppercase">Full Name</label>
                    <input type="text" id="inputName" placeholder="Deborah Johnson" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                </div>
                <div class="space-y-1">
                    <label class="block text-xs font-bold text-slate-700 uppercase">Email Address</label>
                    <input type="email" id="inputEmail" required placeholder="worker@pdmglobal.org" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                </div>
                <div class="space-y-1">
                    <label class="block text-xs font-bold text-slate-700 uppercase">Password</label>
                    <input type="password" id="inputPassword" required placeholder="••••••••" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                </div>
                
                <button type="submit" id="authSubmitBtn" class="w-full bg-purple-700 hover:bg-purple-800 text-white font-semibold py-3.5 rounded-xl transition text-sm shadow">
                    Sign In to Portal
                </button>
                
                <div class="text-center pt-2">
                    <button type="button" onclick="toggleAuthMode()" id="authToggleText" class="text-xs text-purple-700 font-semibold hover:underline">
                        Need an account? Register here
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Header -->
    <header class="bg-purple-900 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-18 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-white/10 p-2.5 rounded-xl text-purple-200"><i class="fa-solid fa-cloud text-xl"></i></div>
                <div>
                    <h1 class="font-bold text-base">PDM Global Workers LMS</h1>
                    <p class="text-xs text-purple-200">Tutor: Pastor Helen Olabiyi</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <span id="navUserName" class="text-xs bg-purple-800 px-3 py-1.5 rounded-lg">Loading...</span>
                <button onclick="logout()" class="text-xs bg-purple-950 text-purple-200 px-3 py-1.5 rounded-lg">Logout</button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <!-- Sidebar Modules -->
            <div class="space-y-4">
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-3">
                    <h3 class="font-bold text-slate-900 text-xs uppercase tracking-wider"><i class="fa-solid fa-list-check text-purple-700"></i> Course Modules (9)</h3>
                    <div id="sidebarModules" class="space-y-2 max-h-[70vh] overflow-y-auto pr-1"></div>
                </div>
            </div>

            <!-- Lecture & Quiz Panel -->
            <div class="lg:col-span-3 space-y-6">
                <div id="lecturePanel" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 space-y-6">
                    <div>
                        <span id="modTag" class="text-xs font-semibold text-purple-700 uppercase">Loading Module...</span>
                        <h2 id="modTitle" class="text-2xl font-bold text-slate-900 mt-1">Please Wait</h2>
                    </div>
                    <div id="modContent" class="text-slate-700 leading-relaxed text-sm space-y-4">Syncing with Firebase Firestore...</div>
                    
                    <!-- Quiz Section -->
                    <div id="quizSection" class="border-t border-slate-200 pt-6 mt-6 hidden">
                        <h3 class="font-bold text-lg text-slate-900 mb-4"><i class="fa-solid fa-pen-to-square text-purple-700"></i> Module Test (10 Marks)</h3>
                        <div id="quizContainer" class="space-y-6"></div>
                        <button onclick="submitQuiz()" class="mt-6 bg-purple-700 hover:bg-purple-800 text-white font-semibold px-6 py-3 rounded-xl text-sm shadow transition">
                            Submit Test & Unlock Next Module
                        </button>
                        <div id="quizResult" class="mt-4 font-bold text-sm"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA9oVYvQPO9EGbcxWNB2-kVRc3ftkBtI2Y",
            authDomain: "pdmglobalworkerslms-9b370.firebaseapp.com",
            projectId: "pdmglobalworkerslms-9b370",
            storageBucket: "pdmglobalworkerslms-9b370.firebasestorage.app",
            messagingSenderId: "577826133846",
            appId: "1:577826133846:web:c4c97a1da9d236750be8f7",
            measurementId: "G-72TS87YV9Q"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let isRegisterMode = false;
        let modulesData = [];
        let currentModuleId = 1;
        let highestCompletedModule = 1;

        auth.onAuthStateChanged(async (user) => {
            if (user) {
                document.getElementById('authModal').classList.add('hidden');
                document.getElementById('navUserName').innerText = user.email;
                
                const userDocRef = db.collection('users').doc(user.uid);
                const userDoc = await userDocRef.get();
                
                if (userDoc.exists) {
                    highestCompletedModule = userDoc.data().highestCompletedModule || 1;
                } else {
                    await userDocRef.set({ email: user.email, highestCompletedModule: 1 });
                    highestCompletedModule = 1;
                }

                await fetchModulesFromFirebase();
            } else {
                document.getElementById('authModal').classList.remove('hidden');
            }
        });

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('nameFieldGroup').classList.toggle('hidden', !isRegisterMode);
            document.getElementById('authSubmitBtn').innerText = isRegisterMode ? 'Register Account' : 'Sign In to Portal';
            document.getElementById('authToggleText').innerText = isRegisterMode ? 'Already have an account? Sign in' : 'Need an account? Register here';
        }

        async function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('inputEmail').value;
            const password = document.getElementById('inputPassword').value;
            try {
                if (isRegisterMode) {
                    const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                    await db.collection('users').doc(userCredential.user.uid).set({ email: email, highestCompletedModule: 1 });
                    alert("Account created successfully!");
                } else {
                    await auth.signInWithEmailAndPassword(email, password);
                }
            } catch (err) {
                alert("Authentication Error: " + err.message);
            }
        }

        async function fetchModulesFromFirebase() {
            try {
                const snapshot = await db.collection('modules').orderBy('moduleId').get();
                modulesData = [];
                snapshot.forEach(doc => {
                    modulesData.push(doc.data());
                });

                if (modulesData.length < 9) {
                    await seedAllModules();
                } else {
                    renderSidebar();
                    loadModule(currentModuleId);
                }
            } catch (err) {
                console.error("Error fetching modules:", err);
            }
        }

        async function seedAllModules() {
            const allModules = [
                {
                    moduleId: 1,
                    tag: "Week 1 • Module 1",
                    title: "The Call to Holiness",
                    content: `
                        <div class="bg-purple-50 border border-purple-200 p-4 rounded-xl mb-6">
                            <h3 class="font-bold text-purple-900 mb-2"><i class="fa-solid fa-circle-info"></i> Course Overview & Guidelines</h3>
                            <p class="text-xs text-slate-700 mb-2">This course trains every PDM worker to live a holy life at home, at work and in service, in 9 modules over 3 weeks. Grounded entirely in Scripture[cite: 3].</p>
                            <p class="text-xs text-slate-700 mb-2"><strong>Who it is for:</strong> Ushers, choir, media, children's teachers, protocol, follow-up, prayer team, sanctuary keepers, department heads, and anyone being considered for service[cite: 3].</p>
                            <p class="text-xs text-slate-700"><strong>Grading & Pass Mark:</strong> Each test is 10 marks (5 questions $\times$ 2 marks). Total = 90 marks[cite: 3]. Pass mark is <strong>60% (54/90)</strong>[cite: 3].</p>
                        </div>
                        <hr class="my-4 border-slate-200">
                        <strong>Memory Verse:</strong> \"Because it is written, Be ye holy; for I am holy.\" - 1 Peter 1:16[cite: 8]<br><br>
                        <strong>Aim:</strong> The worker understands that holiness is God's nature and God's command, not an option for \"super-Christians\"[cite: 4].<br><br>
                        <strong>Teaching Points:</strong><br>
                        1. Holiness starts with who God is. God is holy (Isaiah 6:3; Revelation 4:8). Holiness means separated from sin and set apart for God[cite: 8].<br>
                        2. Holiness is commanded for every believer (1 Peter 1:15-16; 1 Thess. 4:7). It is not reserved for pastors[cite: 8].<br>
                        3. Holiness is required for heaven (Hebrews 12:14; Revelation 21:27). Making heaven requires holiness as a lifestyle[cite: 8].<br>
                        4. Holiness has two sides: separation from sin (2 Cor. 6:17) and dedication to God (Romans 12:1-2)[cite: 8].<br>
                        5. Holiness is not legalism. Rules without a changed heart produce pride (Matthew 23:25-28). Holiness flows from love for God (John 14:15)[cite: 8].
                    `,
                    quiz: [
                        { q: "Holiness simply means:", options: ["Never smiling", "Being separated from sin and set apart for God", "Wearing white", "Attending every service"], answer: 1 },
                        { q: "True or False: Holiness is only required of pastors and ministers.", options: ["True", "False"], answer: 1 },
                        { q: "Which verse says 'without holiness no man shall see the Lord'?", options: ["John 3:16", "Hebrews 12:14", "Psalm 23:1", "Genesis 1:1"], answer: 1 }
                    ]
                },
                {
                    moduleId: 2,
                    tag: "Week 1 • Module 2",
                    title: "Repentance, New Birth and Restitution",
                    content: "<strong>Memory Verse:</strong> \"He that covereth his sins shall not prosper but whoso confesseth and forsaketh them shall have mercy.\" - Proverbs 28:13[cite: 5]<br><br><strong>Teaching Points:</strong><br>1. Holiness begins with the new birth (John 3:3-5; 2 Cor. 5:17)[cite: 5].<br>2. Repentance is godly sorrow plus a decision to stop (2 Cor. 7:10; Acts 3:19)[cite: 5].<br>3. Justification: God cleanses and declares us righteous as though we never sinned (Romans 5:1; Titus 3:5)[cite: 5].<br>4. Restitution is evidence of true repentance: returning stolen items and making past wrongs right[cite: 5].",
                    quiz: [
                        { q: "Repentance is:", options: ["Feeling sorry only", "Godly sorrow with a decision to abstain from sin", "Paying money to the church", "Joining a department"], answer: 1 },
                        { q: "True or False: Restitution is a sign of true repentance.", options: ["True", "False"], answer: 0 },
                        { q: "Which man in Luke 19 promised to restore fourfold?", options: ["Peter", "Nicodemus", "Zacchaeus", "Judas"], answer: 2 }
                    ]
                },
                {
                    moduleId: 3,
                    tag: "Week 1 • Module 3",
                    title: "Sanctification - God's Work in the Heart",
                    content: "<strong>Memory Verse:</strong> \"And the very God of peace sanctify you wholly...\" - 1 Thess. 5:23-24[cite: 6]<br><br><strong>Teaching Points:</strong><br>1. Sanctification is God's will for you (1 Thess. 4:3). It is the work of the Holy Spirit (2 Thess. 2:13)[cite: 6].<br>2. A work of grace received by faith in the blood of Jesus (Hebrews 13:12; 1 John 1:7)[cite: 6].<br>3. God's part: the blood cleanses; our part: consecration, yielding daily, and pursuing holiness (2 Cor. 7:1)[cite: 6].",
                    quiz: [
                        { q: "According to 1 Thess. 4:3, what is the will of God for believers?", options: ["Wealth", "Sanctification", "Fame", "Marriage"], answer: 1 },
                        { q: "True or False: Sanctification is received by faith in the blood of Jesus.", options: ["True", "False"], answer: 0 },
                        { q: "Which word describes the daily yielding of ourselves to God?", options: ["Prosperity", "Consecration", "Success", "Vision"], answer: 1 }
                    ]
                },
                {
                    moduleId: 4,
                    tag: "Week 2 • Module 4",
                    title: "Purity of Heart and Mind",
                    content: "<strong>Memory Verse:</strong> \"Blessed are the pure in heart: for they shall see God.\" - Matthew 5:8[cite: 7]<br><br><strong>Teaching Points:</strong><br>1. Sin starts in the heart (Mark 7:21-23; James 1:14-15)[cite: 7].<br>2. Guard your thought life (Philippians 4:8) and practice sexual purity (1 Cor. 6:18-20)[cite: 7].<br>3. Guard your eyes, phone, and inner attitudes like pride, envy, and bitterness[cite: 7].",
                    quiz: [
                        { q: "According to Mark 7:21-23, where does evil come from?", options: ["The devil only", "The heart", "The village", "Money"], answer: 1 },
                        { q: "True or False: Unforgiveness and envy are not real holiness issues.", options: ["True", "False"], answer: 1 },
                        { q: "Who made a covenant with his eyes?", options: ["Job", "Samson", "David", "Saul"], answer: 0 }
                    ]
                },
                {
                    moduleId: 5,
                    tag: "Week 2 • Module 5",
                    title: "Holiness of Tongue and Conduct",
                    content: "<strong>Memory Verse:</strong> \"But let your communication be, Yea, yea; Nay, nay...\" - Matt. 5:37[cite: 8]<br><br><strong>Teaching Points:</strong><br>1. No swearing, cursing, foolish talking, or crude jokes (James 5:12; Eph. 5:4)[cite: 8].<br>2. Maintain absolute truthfulness; avoid gossip, slander, and backbiting (Eph. 4:25)[cite: 8].",
                    quiz: [
                        { q: "James 5:12 teaches believers to:", options: ["Swear by heaven only", "Not swear at all", "Swear in court only", "Curse enemies"], answer: 1 },
                        { q: "True or False: 'White lies' are acceptable if they keep peace.", options: ["True", "False"], answer: 1 },
                        { q: "Ephesians 5:4 warns against:", options: ["Singing", "Foolish talking and jesting", "Fasting", "Giving"], answer: 1 }
                    ]
                },
                {
                    moduleId: 6,
                    tag: "Week 2 • Module 6",
                    title: "Separation from the World",
                    content: "<strong>Memory Verse:</strong> \"Love not the world, neither the things that are in the world.\" - 1 John 2:15[cite: 9]<br><br><strong>Teaching Points:</strong><br>1. Live distinct from the world without becoming proud or judgmental (2 Cor. 6:14-18)[cite: 9].<br>2. Modest dressing: neat, decent, avoiding immodest or cross-dressing attire (1 Tim. 2:9-10)[cite: 9].",
                    quiz: [
                        { q: "2 Corinthians 6:17 commands believers to:", options: ["Come out and be separate", "Leave the church", "Stop working", "Avoid all unbelievers"], answer: 0 },
                        { q: "True or False: Separation means refusing to talk to unbelievers.", options: ["True", "False"], answer: 1 },
                        { q: "Which verse warns against wearing clothes of the opposite sex?", options: ["Deut. 22:5", "John 3:16", "Psalm 1:1", "Acts 2:38"], answer: 0 }
                    ]
                },
                {
                    moduleId: 7,
                    tag: "Week 3 • Module 7",
                    title: "The Holy Worker - Character Before Gifting",
                    content: "<strong>Memory Verse:</strong> \"If a man therefore purge himself from these...\" - 2 Tim. 2:21[cite: 10]<br><br><strong>Teaching Points:</strong><br>1. God looks for clean vessels; character matters more than gifting (Judges 16:20)[cite: 10].<br>2. Holiness acts as spiritual protection against the enemy (Ephesians 4:27)[cite: 10].",
                    quiz: [
                        { q: "2 Timothy 2:21 says a purged vessel is:", options: ["Famous", "Meet for the master's use", "Rich", "A pastor"], answer: 1 },
                        { q: "True or False: A working gift proves God approves of lifestyle.", options: ["True", "False"], answer: 1 },
                        { q: "Which judge lost his strength through compromise?", options: ["Gideon", "Samson", "Deborah", "Samuel"], answer: 1 }
                    ]
                },
                {
                    moduleId: 8,
                    tag: "Week 3 • Module 8",
                    title: "Holiness in Home, Money and Workplace",
                    content: "<strong>Memory Verse:</strong> \"Marriage is honourable in all, and the bed undefiled.\" - Heb. 13:4[cite: 12]<br><br><strong>Teaching Points:</strong><br>1. Honour marriage, uphold pure courtship, and lead homes in godliness (Eph. 5:22-33)[cite: 12].<br>2. Financial and workplace integrity: honest hours, no fraud or bribery (Colossians 3:22-24)[cite: 12].",
                    quiz: [
                        { q: "Hebrews 13:4 teaches that marriage is:", options: ["Optional", "Honourable in all", "Only for pastors", "A contract to be broken"], answer: 1 },
                        { q: "True or False: Taking a small bribe at work is acceptable.", options: ["True", "False"], answer: 1 },
                        { q: "Romans 13:8 says:", options: ["Owe no man anything but to love one another", "Borrow freely", "Never give", "Lend with interest"], answer: 0 }
                    ]
                },
                {
                    moduleId: 9,
                    tag: "Week 3 • Module 9",
                    title: "Sustaining Holiness - Accountability and Restoration",
                    content: "<strong>Memory Verse:</strong> \"Thy word have I hid in mine heart...\" - Psalm 119:11[cite: 13]<br><br><strong>Teaching Points:</strong><br>1. Sustain holiness via the Word, prayer, fasting, and accountability (Psalm 119:9-11)[cite: 13].<br>2. If you fall: do not hide; confess, repent, and submit to restoration (1 John 1:9; Galatians 6:1)[cite: 13].",
                    quiz: [
                        { q: "Psalm 119:11 says hiding God's Word in the heart helps us to:", options: ["Get rich", "Not sin against God", "Preach louder", "Win arguments"], answer: 1 },
                        { q: "True or False: A worker who falls into sin should hide it.", options: ["True", "False"], answer: 1 },
                        { q: "According to 1 John 1:9, if we confess our sins God will:", options: ["Punish us", "Forgive and cleanse us", "Ignore us", "Remove our gifts"], answer: 1 }
                    ]
                }
            ];

            for (let mod of allModules) {
                await db.collection('modules').doc(mod.moduleId.toString()).set(mod);
            }
            fetchModulesFromFirebase();
        }

        function renderSidebar() {
            let html = '';
            modulesData.forEach(m => {
                const isLocked = m.moduleId > highestCompletedModule;
                if (isLocked) {
                    html += `<div class="w-full text-left p-3 rounded-xl bg-slate-100 border border-slate-200 text-xs font-semibold text-slate-400 cursor-not-allowed flex items-center justify-between"><span>${m.tag}: ${m.title}</span> <i class="fa-solid fa-lock"></i></div>`;
                } else {
                    html += `<button onclick="loadModule(${m.moduleId})" class="w-full text-left p-3 rounded-xl bg-slate-50 border border-slate-200 text-xs font-semibold hover:bg-purple-50 transition flex items-center justify-between"><span>${m.tag}: ${m.title}</span> <i class="fa-solid fa-check text-green-600"></i></button>`;
                }
            });
            document.getElementById('sidebarModules').innerHTML = html;
        }

        function loadModule(id) {
            if (id > highestCompletedModule) {
                alert("Please complete and pass the quiz for the previous module to unlock this one.");
                return;
            }
            currentModuleId = id;
            const m = modulesData.find(mod => mod.moduleId === id);
            if (!m) return;
            document.getElementById('modTag').innerText = m.tag;
            document.getElementById('modTitle').innerText = m.title;
            document.getElementById('modContent').innerHTML = m.content;

            const quizSection = document.getElementById('quizSection');
            if (m.quiz && m.quiz.length > 0) {
                quizSection.classList.remove('hidden');
                let qHtml = '';
                m.quiz.forEach((q, idx) => {
                    qHtml += `<div class="space-y-2"><p class="font-semibold text-slate-800 text-sm">${idx + 1}. ${q.q}</p><div class="space-y-1 pl-2">`;
                    q.options.forEach((opt, optIdx) => {
                        qHtml += `<label class="block text-xs text-slate-700"><input type="radio" name="q_${idx}" value="${optIdx}" class="mr-2"> ${opt}</label>`;
                    });
                    qHtml += `</div></div>`;
                });
                document.getElementById('quizContainer').innerHTML = qHtml;
                document.getElementById('quizResult').innerHTML = '';
            } else {
                quizSection.classList.add('hidden');
            }
        }

        async function submitQuiz() {
            const m = modulesData.find(mod => mod.moduleId === currentModuleId);
            if (!m || !m.quiz) return;
            let score = 0;
            m.quiz.forEach((q, idx) => {
                const selected = document.querySelector(`input[name="q_${idx}"]:checked`);
                if (selected && parseInt(selected.value) === q.answer) {
                    score += 2; 
                }
            });
            const total = m.quiz.length * 2;
            const percentage = (score / total) * 100;
            const passMark = percentage >= 60;

            const resDiv = document.getElementById('quizResult');
            if (passMark) {
                resDiv.innerHTML = `Your Score: ${score}/${total} (${percentage}%) - <span class="text-green-600">PASSED 🎉 Next module unlocked in cloud database!</span>`;
                
                if (currentModuleId >= highestCompletedModule && currentModuleId < 9) {
                    highestCompletedModule = currentModuleId + 1;
                    if (auth.currentUser) {
                        await db.collection('users').doc(auth.currentUser.uid).update({
                            highestCompletedModule: highestCompletedModule
                        });
                    }
                    renderSidebar();
                }
            } else {
                resDiv.innerHTML = `Your Score: ${score}/${total} (${percentage}%) - <span class="text-red-600">FAILED - You need at least 60% to unlock the next module. Please review and retake.</span>`;
            }
        }

        function logout() {
            auth.signOut().then(() => window.location.reload());
        }
    </script>
</body>
</html>
