<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDM Global Workers LMS | Firebase Cloud Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase App & Services CDNs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col justify-between">

    <!-- Firebase Auth Modal (Login / Register) -->
    <div id="authModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full overflow-hidden border border-slate-200">
            <div class="bg-gradient-to-r from-purple-800 to-indigo-900 text-white p-8 text-center space-y-2">
                <div class="w-16 h-16 bg-white/10 rounded-2xl mx-auto flex items-center justify-center text-purple-200 text-2xl mb-2">
                    <i class="fa-solid fa-cloud"></i>
                </div>
                <h2 class="font-bold text-xl tracking-tight">PDM Global Workers LMS</h2>
            </div>
            
            <form id="authForm" onsubmit="handleAuth(event)" class="p-8 space-y-4">
                <div id="nameFieldGroup" class="space-y-1 hidden">
                    <label class="block text-xs font-bold text-slate-700 uppercase">Full Name</label>
                    <input type="text" id="inputName" placeholder="Deborah Johnson" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                </div>
                <div class="space-y-1">
                    <label class="block text-xs font-bold text-slate-700 uppercase">Email Address</label>
                    <input type="email" id="inputEmail" required placeholder="worker@pdmglobal.org" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                </div>
                <div class="space-y-1">
                    <label class="block text-xs font-bold text-slate-700 uppercase">Password</label>
                    <div class="relative">
                        <input type="password" id="inputPassword" required placeholder="••••••••" class="w-full p-3 pr-10 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600">
                            <i id="passwordToggleIcon" class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <button type="submit" id="authSubmitBtn" class="w-full bg-purple-700 hover:bg-purple-800 text-white font-semibold py-3.5 rounded-xl transition text-sm shadow">
                    Sign In to Portal
                </button>
                
                <div class="text-center pt-2">
                    <button type="button" onclick="toggleAuthMode()" id="authToggleText" class="text-xs text-purple-700 font-semibold hover:underline">
                        Need an account? Register here
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Admin Course Upload Modal -->
    <div id="adminModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full overflow-hidden border border-slate-200 max-h-[90vh] flex flex-col">
            <div class="bg-purple-900 text-white px-6 py-4 flex items-center justify-between">
                <span class="font-bold text-sm"><i class="fa-solid fa-shield-halved"></i> Admin Firebase Upload Portal</span>
                <button onclick="closeAdminModal()" class="text-purple-200 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <form onsubmit="handleAdminUpload(event)" class="p-6 space-y-4 overflow-y-auto text-sm flex-grow">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Module ID (Number)</label>
                        <input type="number" id="adminModId" required value="1" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Module Tag</label>
                        <input type="text" id="adminModTag" required placeholder="Module 1 • Foundation" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Module Title</label>
                    <input type="text" id="adminModTitle" required class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Lecture HTML Content</label>
                    <textarea id="adminModContent" rows="6" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-mono text-xs"></textarea>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeAdminModal()" class="px-4 py-2 bg-slate-100 text-slate-700 rounded-xl text-xs font-semibold">Cancel</button>
                    <button type="submit" class="bg-purple-700 text-white px-5 py-2 rounded-xl text-xs font-semibold shadow">Save to Firestore</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Header -->
    <header class="bg-purple-900 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-18 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-white/10 p-2.5 rounded-xl text-purple-200"><i class="fa-solid fa-cloud text-xl"></i></div>
                <div>
                    <h1 class="font-bold text-base">PDM Global Workers LMS</h1>
                    <p class="text-xs text-purple-200">Tutor: Pastor Helen Olabiyi</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button id="adminNavBtn" onclick="openAdminModal()" class="hidden text-xs bg-indigo-700 hover:bg-indigo-800 text-white px-3 py-1.5 rounded-lg font-semibold shadow">
                    <i class="fa-solid fa-gear"></i> Admin Upload
                </button>
                <span id="navUserName" class="text-xs bg-purple-800 px-3 py-1.5 rounded-lg">Loading...</span>
                <button onclick="logout()" class="text-xs bg-purple-950 text-purple-200 px-3 py-1.5 rounded-lg">Logout</button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <div class="space-y-4">
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-3">
                    <h3 class="font-bold text-slate-900 text-xs uppercase tracking-wider"><i class="fa-solid fa-list-check text-purple-700"></i> Course Modules</h3>
                    <div id="sidebarModules" class="space-y-2"></div>
                </div>
            </div>

            <div class="lg:col-span-3 space-y-6">
                <div id="lecturePanel" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 space-y-4">
                    <span id="modTag" class="text-xs font-semibold text-purple-700 uppercase">Loading Module...</span>
                    <h2 id="modTitle" class="text-2xl font-bold text-slate-900">Please Wait</h2>
                    <div id="modContent" class="text-slate-700 leading-relaxed text-sm">Syncing with Firebase Firestore...</div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Configured with your brand new Firebase Project credentials[cite: 11]
        const firebaseConfig = {
            apiKey: "AIzaSyA9oVYvQP09EGbcxWNB2-kVrc3ftkBti2Y",
            authDomain: "pdmglobalworkerslms-9b370.firebaseapp.com",
            projectId: "pdmglobalworkerslms-9b370",
            storageBucket: "pdmglobalworkerslms-9b370.firebasestorage.app",
            messagingSenderId: "577826133846",
            appId: "1:577826133846:web:c4c97a1da9d236750be8f7",
            measurementId: "G-72TS87YV9Q"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let isRegisterMode = false;
        let modulesData = [];

        // Track Auth State changes
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                document.getElementById('authModal').classList.add('hidden');
                document.getElementById('navUserName').innerText = user.email;
                
                if (user.email.includes('admin') || user.email === 'pastorhelen@pdmglobal.org') {
                    document.getElementById('adminNavBtn').classList.remove('hidden');
                }
                await fetchModulesFromFirebase();
            } else {
                document.getElementById('authModal').classList.remove('hidden');
            }
        });

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('nameFieldGroup').classList.toggle('hidden', !isRegisterMode);
            document.getElementById('authSubmitBtn').innerText = isRegisterMode ? 'Register Account' : 'Sign In to Portal';
            document.getElementById('authToggleText').innerText = isRegisterMode ? 'Already have an account? Sign in' : 'Need an account? Register here';
        }

        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('inputPassword');
            const icon = document.getElementById('passwordToggleIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.className = 'fa-regular fa-eye-slash';
            } else {
                passwordInput.type = 'password';
                icon.className = 'fa-regular fa-eye';
            }
        }

        async function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('inputEmail').value;
            const password = document.getElementById('inputPassword').value;

            try {
                if (isRegisterMode) {
                    await auth.createUserWithEmailAndPassword(email, password);
                    alert("Account created successfully!");
                } else {
                    await auth.signInWithEmailAndPassword(email, password);
                }
            } catch (err) {
                alert("Authentication Error: " + err.message);
            }
        }

        async function fetchModulesFromFirebase() {
            try {
                const snapshot = await db.collection('modules').orderBy('moduleId').get();
                modulesData = [];
                snapshot.forEach(doc => {
                    modulesData.push(doc.data());
                });

                if (modulesData.length === 0) {
                    const defaultMod = {
                        moduleId: 1,
                        tag: "Module 1 • Foundation",
                        title: "Principles of Effective Global Service",
                        content: "<h3>The Heart of a Kingdom Worker</h3><p>Service in the vineyard is a sacred privilege...</p>"
                    };
                    await db.collection('modules').doc('1').set(defaultMod);
                    modulesData = [defaultMod];
                }

                renderSidebar();
                loadModule(modulesData[0].moduleId);
            } catch (err) {
                console.error("Error fetching modules:", err);
            }
        }

        function renderSidebar() {
            let html = '';
            modulesData.forEach(m => {
                html += `<button onclick="loadModule(${m.moduleId})" class="w-full text-left p-3 rounded-xl bg-slate-50 border border-slate-200 text-xs font-semibold hover:bg-purple-50">${m.tag}</button>`;
            });
            document.getElementById('sidebarModules').innerHTML = html;
        }

        function loadModule(id) {
            const m = modulesData.find(mod => mod.moduleId === id);
            if (!m) return;
            document.getElementById('modTag').innerText = m.tag;
            document.getElementById('modTitle').innerText = m.title;
            document.getElementById('modContent').innerHTML = m.content;
        }

        function openAdminModal() { document.getElementById('adminModal').classList.remove('hidden'); }
        function closeAdminModal() { document.getElementById('adminModal').classList.add('hidden'); }

        async function handleAdminUpload(event) {
            event.preventDefault();
            const moduleId = parseInt(document.getElementById('adminModId').value);
            const payload = {
                moduleId: moduleId,
                tag: document.getElementById('adminModTag').value,
                title: document.getElementById('adminModTitle').value,
                content: document.ico = document.getElementById('adminModContent').value
            };

            try {
                await db.collection('modules').doc(moduleId.toString()).set(payload, { merge: true });
                alert("Module uploaded successfully to Firebase Firestore!");
                closeAdminModal();
                fetchModulesFromFirebase();
            } catch (err) {
                alert("Upload failed: " + err.message);
            }
        }

        function logout() {
            auth.signOut().then(() => window.location.reload());
        }
    </script>
</body>
</html>
